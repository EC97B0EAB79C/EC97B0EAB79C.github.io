name: Deploy Quartz Site

on:
  push:
    branches:
      - md-main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout User Content
        uses: actions/checkout@v4
        with:
          path: 'my-content'

      - name: Checkout Quartz Engine
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: 'quartz-engine'
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Overlay Content and Config
        run: |
          rm -rf quartz-engine/content
          cp -r my-content/content quartz-engine/content
          [ -f my-content/quartz.config.ts ] && cp my-content/quartz.config.ts quartz-engine/quartz.config.ts
          [ -f my-content/quartz.layout.ts ] && cp my-content/quartz.layout.ts quartz-engine/quartz.layout.ts
          [ -f my-content/custom.scss ] && cp my-content/custom.scss quartz-engine/quartz/styles/custom.scss

      - name: Build Quartz
        working-directory: quartz-engine
        run: |
          npm ci
          npx quartz build

      # NEW: Upload the build result (quartz-engine/public) as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-engine/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
